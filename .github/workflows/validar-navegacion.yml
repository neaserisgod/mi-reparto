name: Validar navegación en Android
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Reutilizar APK de emulador de otra ejecución (vacío para compilar)
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  gps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: inputs.apk_run_id == ''
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python -m pip install Pillow==12.0.0
      - run: flutter pub get
        if: inputs.apk_run_id == ''
      - name: Compilar solo el escenario de prueba
        if: inputs.apk_run_id == ''
        # MapLibre #3648: OpenGL del emulador oculta textos y sprites.
        # Solo la prueba usa Vulkan; el APK distribuido conserva OpenGL.
        run: env 'ORG_GRADLE_PROJECT_maplibre_gl.renderer=vulkan' flutter build apk --debug --target-platform android-x64 --target lib/prueba_navegacion.dart
      - uses: actions/upload-artifact@v4
        if: inputs.apk_run_id == ''
        with:
          name: navegacion-emulador-x64
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
      - uses: actions/download-artifact@v4
        if: inputs.apk_run_id != ''
        with:
          name: navegacion-emulador-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.apk_run_id }}
          path: build/app/outputs/flutter-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: python tool/probar_gps.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacion-gps
          path: evidencia-gps/
