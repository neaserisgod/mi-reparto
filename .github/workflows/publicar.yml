name: Publicar actualización Android
on:
  workflow_dispatch:
    inputs:
      notas:
        description: Qué cambió en esta actualización
        required: true
        default: Mejoras y correcciones
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publicar-actualizacion
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ID: mi-reparto
      RELEASE_NOTES: ${{ inputs.notas || 'Mejoras y correcciones' }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tool -p 'test_*.py'
      - run: python -m pip install cryptography==46.0.3
      - name: Preparar firma estable mediante identidad de GitHub
        run: python tool/publicar.py prepare
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Versionar y compilar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          name=next(x.split(':',1)[1].strip().split('+')[0] for x in Path('pubspec.yaml').read_text().splitlines() if x.startswith('version:'))
          build=int(os.environ['BUILD_NUMBER'])+1000
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'APP_VERSION={name}+{build}\n')
              f.write(f'VERSION_NAME={name}\n')
              f.write(f'VERSION_BUILD={build}\n')
          PYTHON
      - name: Compilar APK firmado
        run: flutter build apk --release --target-platform android-arm64 --build-name "$VERSION_NAME" --build-number "$VERSION_BUILD"
      - name: Firmar el APK final explícitamente
        run: python tool/publicar.py sign
      - name: Publicar APK verificado y versión
        run: python tool/publicar.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: mi-reparto-actualizacion
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
