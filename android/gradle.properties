org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# GPS nativo sin proveedor Google para MapLibre.
maplibre_gl.playServicesLocation=false

# Un único APK ARM64 por versión: no sumar un prefijo ABI al versionCode.
force-version-code-ignoring-abi=true
