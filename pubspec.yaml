name: mi_reparto
description: Clientes, envases y cuenta corriente para el reparto de agua.
publish_to: none
version: 0.3.0+3
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  http: ^1.6.0
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  maplibre_gl: ^0.28.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/mapa_estilo.json
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
